apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-nginx
  namespace: olatunde-dev-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/akin-olatunde/openshift-repo.git 
    targetRevision: main
    path: olatunde-dev   
  destination:
    server: https://kubernetes.default.svc
    namespace: olatunde-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  
