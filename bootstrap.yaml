apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-bootstrap-root
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/akin-olatunde/openshift-repo.git'
    targetRevision: main
    path: 'apps' 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
  - group: operators.coreos.com
    kind: Subscription
    jsonPointers:
    - /status
  - group: operators.coreos.com
    kind: OperatorGroup
    jsonPointers:
    - /status   
