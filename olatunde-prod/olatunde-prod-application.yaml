apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-kustom-nginx
  namespace: olatunde-prod-gitops   # Must be in the Argo CD instance's namespace
spec:
  project: default
  source:
    repoURL: https://github.com/akin-olatunde/openshift-repo.git  # REPLACE with your Git repo URL
    targetRevision: main
    path: olatunde-prod   # Path to the folder containing your manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: olatunde-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # Since the namespace already exists
