apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces-creation
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/akin-olatunde/openshift-repo.git
    targetRevision: main
    path: apps/workloads/foundation 
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
