apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: child-platform-operators
  namespace: openshift-gitops
  annotations:
    # WAVE 1: Forces the OLM subscriptions to fire first in line!
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/akin-olatunde/openshift-repo.git
    targetRevision: main
    path: apps/workloads/operators # <=== SURGICALLY POINTS TO OPERATORS DIRECTORY!
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
