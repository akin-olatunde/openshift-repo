apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-nginx
  namespace: openshift-gitops
  argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/akin-olatunde/openshift-repo.git 
    targetRevision: main
    path: apps/workloads/nginx-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: olatunde-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  
