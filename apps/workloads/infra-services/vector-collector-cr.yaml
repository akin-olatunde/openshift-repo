apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: logging-collector
  namespace: openshift-logging
  annotations: 
    observability.openshift.io/log-level: info
spec:
  serviceAccount:
    name: logs-collector-sa
  collector:
    maxUnavailable: 50%
    resources:
      requests:
        memory: 128Mi
        cpu: 25m
      limits:
        cpu: 50m     
        memory: 256Mi
    networkPolicy:
      ruleSet: AllowAllIngressEgress
  inputs:
  - name: application
    type: application
    application:
      tuning:
        container:
          maxMessageSize: 12Ki
          rateLimitPerContainer:
            maxRecordsPerSecond: 100
  - name: infrastructure
    type: infrastructure
    infrastructure:
      tuning:
        container:
          maxMessageSize: 12Ki
          rateLimitPerContainer:
            maxRecordsPerSecond: 100    
  - name: audit
    type: audit
    audit:
      tuning:
        container:
          maxMessageSize: 8Ki
          rateLimitPerContainer:
            maxRecordsPerSecond: 200              
  outputs:
    - name: logging-loki
      type: lokiStack
      lokiStack:
        authentication:
          token:
            from: serviceAccount
        target:
          name: logging-loki
          namespace: openshift-logging
      tls:
        ca:
          key: service-ca.crt
          configMapName: openshift-service-ca.crt
  pipelines:
    - name: logs-to-loki
      inputRefs:
        - application
        - infrastructure
      outputRefs:
        - logging-loki
