apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
namespace: olatunde-testing
namePrefix: testing-
patches:
- path: route-patch.yaml
  target:
    kind: Route
    name: kustom-nginx-route
images:
- name: docker.io/bitnami/nginx:latest  
#  newName: docker.io/library/nginx:alpine  # Forcefully swaps it out
#  newTag: latest
replicas:
- name: kustom-nginx
  count: 5

