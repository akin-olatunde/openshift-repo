apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
namespace: olatunde-dev
namePrefix: dev-
patches:
- path: route-patch.yaml
  target:
    kind: Route
    name: kustom-nginx-route
images:
- name: docker.io/bitnami/nginx:latest  
replicas:
- name: kustom-nginx
  count: 1

